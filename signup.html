<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Rpire</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f4f7fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.06);
      border: 1px solid #eef2f6;
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: #475569; margin-bottom: 24px; display: block; }
    label { font-weight: 500; font-size: 14px; color: #1e293b; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce2ec;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 16px;
      background: #fafbfc;
      font-family: inherit;
    }
    input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 4px rgba(37,99,235,0.08); }
    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
      transition: 0.2s;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .footer-text {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #64748b;
    }
    .footer-text a { color: #2563eb; text-decoration: none; font-weight: 500; }
    .error { color: #dc2626; font-size: 14px; margin-top: 4px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>Create your account</h1>
  <span class="sub">Start reclaiming your time.</span>

  <form id="signupForm">
    <label>Email</label>
    <input type="email" id="emailInput" placeholder="you@example.com" required />

    <label>Password</label>
    <input type="password" id="passwordInput" placeholder="Create a password" required minlength="6" />

    <div id="errorMessage" class="error">Please fill in all fields.</div>

    <button type="submit" class="btn-primary">🚀 Create Account</button>

    <p class="footer-text">
      Already have an account? <a href="#" onclick="alert('Login page coming soon!')">Log In</a>
    </p>
  </form>
</div>

<script>
  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const errorEl = document.getElementById('errorMessage');

    if (!email || !password) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Please fill in all fields.';
      return;
    }

    if (password.length < 6) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Password must be at least 6 characters.';
      return;
    }

    errorEl.style.display = 'none';

    // Store user in localStorage
    localStorage.setItem('rpire_user', JSON.stringify({ email }));

    alert('✅ Account created! Welcome to Rpire.');
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
