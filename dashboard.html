<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sylvie — AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #faf0f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #2d1b2e;
      padding: 20px;
    }

    .dashboard {
      width: 100%;
      max-width: 740px;
      background: rgba(255, 245, 248, 0.65);
      backdrop-filter: blur(24px);
      border-radius: 40px;
      padding: 28px 32px 32px;
      box-shadow: 0 20px 40px rgba(180, 120, 160, 0.08), 0 8px 16px rgba(180, 120, 160, 0.04);
      border: 1px solid rgba(255, 220, 235, 0.5);
      transition: all 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #e8b4d8, #c9a0dc);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 22px;
      color: #4a2b4a;
      box-shadow: 0 8px 16px rgba(200, 150, 200, 0.12);
    }
    .header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #3d2a3d;
    }
    .header .status {
      font-size: 13px;
      color: #b5838d;
      background: rgba(200, 150, 170, 0.1);
      padding: 2px 14px;
      border-radius: 40px;
      border: 1px solid rgba(200, 150, 170, 0.1);
    }
    .header .settings-btn {
      background: rgba(200, 150, 170, 0.08);
      border: none;
      border-radius: 40px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #5a3d5a;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(200, 150, 170, 0.05);
    }
    .header .settings-btn:hover {
      background: rgba(200, 150, 170, 0.15);
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .quick-actions button {
      background: rgba(255, 240, 245, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 220, 235, 0.5);
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 500;
      color: #3d2a3d;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-actions button:hover {
      background: #fff5f8;
      box-shadow: 0 4px 12px rgba(180, 120, 160, 0.06);
      transform: translateY(-1px);
    }

    .chat {
      background: rgba(255, 245, 248, 0.45);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 16px 18px;
      min-height: 300px;
      border: 1px solid rgba(255, 220, 235, 0.3);
      display: flex;
      flex-direction: column;
    }
    .messages {
      flex: 1;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #e8d0dc; border-radius: 4px; }

    .message {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 82%;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.25s ease;
      word-wrap: break-word;
    }
    .message.user {
      background: #3d2a3d;
      color: #fcf0f5;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.sylvie {
      background: #fffafc;
      border: 1px solid rgba(255, 220, 235, 0.3);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(180, 120, 160, 0.04);
      color: #2d1b2e;
    }
    .message.sylvie .draft-card {
      margin-top: 8px;
      background: #fcf0f7;
      padding: 12px;
      border-radius: 12px;
      border-left: 3px solid #c9a0dc;
      font-size: 13px;
      color: #2d1b2e;
    }
    .message.sylvie .draft-card .actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    .message.sylvie .draft-card .actions button {
      background: none;
      border: 1px solid #e8d0dc;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      color: #3d2a3d;
    }
    .message.sylvie .draft-card .actions .send {
      background: #3d2a3d;
      color: #fcf0f5;
      border: none;
    }
    .message.sylvie .draft-card .actions .send:hover { background: #5a3d5a; }
    .message.sylvie .draft-card .actions .edit:hover { background: #f5e8f0; }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
    }
    .input-area input {
      flex: 1;
      background: rgba(255, 245, 248, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 220, 235, 0.4);
      border-radius: 40px;
      padding: 10px 16px;
      font-size: 14px;
      color: #2d1b2e;
      outline: none;
      transition: all 0.2s;
    }
    .input-area input:focus {
      border-color: #c9a0dc;
      box-shadow: 0 0 0 3px rgba(200, 150, 200, 0.06);
    }
    .input-area input::placeholder { color: #b08a9a; }
    .input-area button {
      background: #3d2a3d;
      border: none;
      border-radius: 40px;
      padding: 10px 22px;
      color: #fcf0f5;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .input-area button:hover { background: #5a3d5a; }

    .typing {
      font-size: 13px;
      color: #b08a9a;
      padding: 4px 0 8px 0;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

    .footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #b08a9a;
    }
    .footer .badge {
      background: rgba(200, 150, 170, 0.06);
      padding: 2px 12px;
      border-radius: 40px;
    }

    /* ─── SETTINGS PANEL ─── */
    .settings-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 20, 30, 0.2);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .settings-overlay.active { display: flex; }
    .settings-panel {
      background: #fcf5f9;
      border-radius: 32px;
      padding: 32px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 32px 64px rgba(120, 80, 120, 0.12);
      border: 1px solid rgba(255, 220, 235, 0.4);
      animation: fadeIn 0.2s ease;
    }
    .settings-panel h2 {
      font-size: 20px;
      font-weight: 600;
      color: #3d2a3d;
      margin-bottom: 20px;
    }
    .settings-panel label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #5a3d5a;
      margin-bottom: 4px;
    }
    .settings-panel input, .settings-panel select {
      width: 100%;
      background: rgba(255, 245, 248, 0.6);
      border: 1px solid rgba(200, 150, 170, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      color: #2d1b2e;
      margin-bottom: 16px;
      outline: none;
      transition: all 0.2s;
    }
    .settings-panel input:focus, .settings-panel select:focus {
      border-color: #c9a0dc;
      box-shadow: 0 0 0 3px rgba(200, 150, 200, 0.06);
    }
    .settings-panel .actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .settings-panel .actions button {
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .settings-panel .actions .save {
      background: #3d2a3d;
      color: #fcf0f5;
    }
    .settings-panel .actions .save:hover { background: #5a3d5a; }
    .settings-panel .actions .close {
      background: rgba(200, 150, 170, 0.1);
      color: #5a3d5a;
    }
    .settings-panel .actions .close:hover { background: rgba(200, 150, 170, 0.2); }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <div class="header-left">
      <div class="avatar">✦</div>
      <div>
        <h1>Sylvie</h1>
        <span class="status">● Online</span>
      </div>
    </div>
    <button class="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
  </div>

  <div class="quick-actions">
    <button onclick="sendQuick('Show my inbox')">📥 Inbox</button>
    <button onclick="sendQuick('Show urgent emails')">⚠️ Urgent</button>
    <button onclick="sendQuick('Draft an email to Sarah about the project')">✏️ Draft</button>
    <button onclick="sendQuick('Schedule a meeting with Rahul')">📅 Meeting</button>
  </div>

  <div class="chat">
    <div class="messages" id="messages">
      <div class="message sylvie">👋 Hey, I'm Sylvie. Ask me anything — emails, calendar, tasks, or just chat.</div>
    </div>
    <div id="typingIndicator" class="typing" style="display:none;">Sylvie is thinking...</div>
    <div class="input-area">
      <input type="text" id="chatInput" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="footer">
    <span class="badge">🔒 Private & local</span>
    <span class="badge">Mistral 7B</span>
  </div>
</div>

<!-- ─── SETTINGS OVERLAY ─── -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h2>⚙️ Settings</h2>
    <label>Display Name</label>
    <input type="text" id="settingsName" placeholder="Maithili" />

    <label>Email Signature</label>
    <input type="text" id="settingsSignature" placeholder="Best, Maithili" />

    <label>Default Tone</label>
    <select id="settingsTone">
      <option value="professional">Professional</option>
      <option value="friendly">Friendly</option>
      <option value="concise">Concise</option>
      <option value="warm">Warm</option>
    </select>

    <label>Model</label>
    <select id="settingsModel">
      <option value="sylvie-nova">NovaForge Mistral (fast)</option>
      <option value="sylvie-mistral">Mistral 7B (smart)</option>
      <option value="sylvie-phi">Phi-3 (balanced)</option>
    </select>

    <div class="actions">
      <button class="save" onclick="saveSettings()">Save</button>
      <button class="close" onclick="toggleSettings()">Close</button>
    </div>
  </div>
</div>

<script>
  // ─── LOAD SAVED SETTINGS ──────────────────────────────────────
  function loadSettings() {
    const saved = JSON.parse(localStorage.getItem('sylvie_settings'));
    if (saved) {
      document.getElementById('settingsName').value = saved.name || 'Maithili';
      document.getElementById('settingsSignature').value = saved.signature || 'Best, Maithili';
      document.getElementById('settingsTone').value = saved.tone || 'professional';
      document.getElementById('settingsModel').value = saved.model || 'sylvie-nova';
    }
  }
  loadSettings();

  // ─── TOGGLE SETTINGS ───────────────────────────────────────────
  function toggleSettings() {
    document.getElementById('settingsOverlay').classList.toggle('active');
  }

  // ─── SAVE SETTINGS ─────────────────────────────────────────────
  function saveSettings() {
    const settings = {
      name: document.getElementById('settingsName').value.trim() || 'Maithili',
      signature: document.getElementById('settingsSignature').value.trim() || 'Best, Maithili',
      tone: document.getElementById('settingsTone').value,
      model: document.getElementById('settingsModel').value
    };
    localStorage.setItem('sylvie_settings', JSON.stringify(settings));
    alert('✅ Settings saved!');
    toggleSettings();
  }

  // ─── SEND MESSAGE ──────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';

    addMessage('user', msg);
    setTyping(true);

    try {
      const res = await fetch('http://localhost:3001/api/sylvie/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();

      if (data.type === 'draft') {
        addDraft(data.to, data.subject, data.body, data.draftId);
      } else {
        addMessage('sylvie', data.response || '✅ Done.');
      }
    } catch (e) {
      addMessage('sylvie', '❌ Could not reach Sylvie. Make sure the backend is running.');
    }
    setTyping(false);
  }

  // ─── QUICK ACTIONS ──────────────────────────────────────────────
  function sendQuick(msg) {
    document.getElementById('chatInput').value = msg;
    sendMessage();
  }

  // ─── ADD MESSAGE ────────────────────────────────────────────────
  function addMessage(type, text) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.textContent = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  // ─── ADD DRAFT CARD ─────────────────────────────────────────────
  function addDraft(to, subject, body, draftId) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message sylvie';
    div.innerHTML = `
      <div><strong>✉️ Draft ready</strong></div>
      <div class="draft-card">
        <div><strong>To:</strong> ${to}</div>
        <div><strong>Subject:</strong> ${subject}</div>
        <div style="margin:6px 0; white-space:pre-wrap;">${body}</div>
        <div class="actions">
          <button class="send" onclick="sendDraft('${draftId}')">📤 Send</button>
          <button class="edit" onclick="editDraft('${draftId}')">✏️ Edit</button>
        </div>
      </div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  // ─── SEND DRAFT ─────────────────────────────────────────────────
  async function sendDraft(draftId) {
    try {
      const res = await fetch('http://localhost:3001/api/sylvie/draft/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ draftId })
      });
      if (res.ok) {
        addMessage('sylvie', '✅ Email sent successfully!');
      } else {
        addMessage('sylvie', '❌ Failed to send.');
      }
    } catch (e) {
      addMessage('sylvie', '❌ Network error.');
    }
  }

  // ─── EDIT DRAFT ──────────────────────────────────────────────────
  function editDraft(draftId) {
    alert('✏️ Edit feature coming soon — you can also edit directly in Gmail drafts.');
  }

  // ─── TYPING INDICATOR ──────────────────────────────────────────
  function setTyping(active) {
    document.getElementById('typingIndicator').style.display = active ? 'block' : 'none';
  }

  // ─── ENTER KEY ──────────────────────────────────────────────────
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // ─── CLOSE SETTINGS ON OVERLAY CLICK ──────────────────────────
  document.getElementById('settingsOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) toggleSettings();
  });
</script>
</body>
</html>
