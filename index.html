<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rpire — AI Scheduler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f4f7fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.06);
      border: 1px solid #eef2f6;
    }
    h1 { font-size: 28px; font-weight: 700; color: #0a0a0a; margin-bottom: 4px; }
    .sub { color: #2563eb; font-weight: 500; margin-bottom: 20px; display: block; }
    .email-box {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce2ec;
      border-radius: 12px;
      font-size: 15px;
      margin: 16px 0;
      background: #fafbfc;
      font-family: inherit;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
      width: 100%;
      transition: 0.2s;
    }
    .btn-primary:hover { background: #1d4ed8; transform: scale(1.01); }
    .btn-secondary {
      background: #e8edf5;
      color: #1e293b;
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      margin: 4px;
    }
    .btn-secondary:hover { background: #d0d9e6; }
    .card {
      background: #f8fafc;
      padding: 16px;
      border-radius: 16px;
      margin: 12px 0;
      border-left: 4px solid #2563eb;
    }
    .hidden { display: none; }
    .status { color: #16a34a; font-weight: 500; margin-top: 10px; }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1>Rpire</h1>
  <span class="sub">Your AI Chief of Staff</span>

  <div id="step-input">
    <p style="margin: 16px 0 6px; font-weight: 500;">Paste the email thread you want to schedule from:</p>
    <textarea id="emailText" rows="4" class="email-box" placeholder="Paste email conversation here...">I'd like to discuss the project. Are you free Tuesday or Wednesday?</textarea>
    <button class="btn-primary" id="findTimesBtn">🔍 Find Available Times</button>
  </div>

  <div id="step-options" class="hidden">
    <p style="margin-top: 20px; font-weight: 600; color: #0a0a0a;">✅ You approve. Then it books.</p>
    <p style="color: #475569; font-size: 14px;">Rpire found these times based on your email:</p>
    <div id="timeSlotContainer"></div>
    <p id="confirmationMessage" class="status hidden">✅ Meeting booked! Check your calendar.</p>
  </div>

  <div id="log" style="margin-top:20px; font-size:12px; color:#94a3b8; border-top:1px solid #eef2f6; padding-top:12px;"></div>
</div>

<script>
document.getElementById('findTimesBtn').addEventListener('click', function() {
  const log = document.getElementById('log');
  const stepOptions = document.getElementById('step-options');
  const container = document.getElementById('timeSlotContainer');
  const confirmationMsg = document.getElementById('confirmationMessage');

  log.innerText = '🧠 Rpire AI is analyzing your email...';
  stepOptions.classList.add('hidden');
  confirmationMsg.classList.add('hidden');

  // --- MOCK MODE: No API Key needed ---
  const mockTimes = [
    { day: 'Tuesday, Oct 24', time: '10:00 AM (PST)', duration: '45 min' },
    { day: 'Wednesday, Oct 25', time: '2:00 PM (PST)', duration: '45 min' },
    { day: 'Thursday, Oct 26', time: '11:00 AM (PST)', duration: '45 min' }
  ];

  log.innerText = '✅ AI generated 3 options based on your email.';

  container.innerHTML = '';
  mockTimes.forEach((slot) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <strong>${slot.day}</strong><br>
      ⏰ ${slot.time} (${slot.duration})
      <button class="btn-secondary" style="float: right;" onclick="confirmBooking('${slot.day} ${slot.time}')">
        ✅ Confirm
      </button>
    `;
    container.appendChild(div);
  });

  stepOptions.classList.remove('hidden');
});

function confirmBooking(timeSelected) {
  const msg = document.getElementById('confirmationMessage');
  const log = document.getElementById('log');
  log.innerText = `📅 Booking ${timeSelected}...`;
  setTimeout(() => {
    msg.classList.remove('hidden');
    msg.innerText = `✅ Meeting confirmed for ${timeSelected}. Calendar invite ready!`;
    log.innerText = '✅ Done. You approved. Rpire booked it.';
  }, 1000);
}
</script>
</body>
</html>
